<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกงานอิสราเอล V23.4 (Final Matrix)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --main-bg: #040608; 
            --card-bg: rgba(15, 22, 20, 0.7); 
            --neon-blue: #00d2ff; 
            --neon-green: #00ff88; 
            --matrix-green: #00ff41; 
            --deep-green: #008f11;
            --neon-pink: #ff007f; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--main-bg); color: #e0e0e0; margin: 0; padding: 15px; line-height: 1.5; font-size: 14px; }
        .container { max-width: 450px; margin: 0 auto; }
        
        /* Header Stats */
        .main-stat-card { background: linear-gradient(145deg, rgba(0, 255, 136, 0.08), rgba(0, 210, 255, 0.02)); border: 1px solid rgba(0, 255, 136, 0.1); border-radius: 30px; padding: 25px; text-align: center; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .net-label { font-size: 0.75rem; color: var(--neon-green); text-transform: uppercase; letter-spacing: 2px; font-weight: bold; opacity: 0.8; }
        .net-amount { font-size: 3.8rem; font-weight: 900; color: #fff; margin: 5px 0; display: block; text-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
        .thb-amount { font-size: 1.5rem; color: var(--matrix-green); font-weight: 600; text-shadow: 0 0 10px var(--matrix-green); }

        /* กราฟ */
        .chart-container { height: 160px; margin-bottom: 20px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 20px; border: 1px solid rgba(0, 255, 136, 0.05); }

        /* Control Panel */
        .glass-panel { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 25px; padding: 20px; margin-bottom: 15px; backdrop-filter: blur(15px); }
        .timer-display { font-size: 3.2rem; font-family: monospace; font-weight: bold; color: #fff; text-align: center; margin-bottom: 15px; text-shadow: 0 0 20px var(--neon-green); }
        
        .btn { border: none; border-radius: 20px; font-weight: 800; cursor: pointer; transition: 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-main { height: 65px; font-size: 1.2rem; margin-bottom: 10px; }
        .btn-start { background: #fff; color: #000; }
        .btn-end { background: linear-gradient(45deg, var(--neon-green), var(--deep-green)); color: #000; box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4); }
        .btn-secondary { background: rgba(255,255,255,0.03); color: #aaa; padding: 14px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.05); }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        input, select { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #fff; padding: 14px; width: 100%; font-size: 1rem; }
        
        /* List */
        .history-item { background: rgba(255,255,255,0.01); border-radius: 18px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.03); }
        .hist-day { font-size: 1.8rem; font-weight: 900; color: #222; line-height: 1; }
        .hist-pay { text-align: right; font-weight: 800; font-size: 1.1rem; color: var(--matrix-green); text-shadow: 0 0 10px var(--matrix-green); }
    </style>
</head>
<body>

<div class="container">
    <div class="main-stat-card">
        <span class="net-label">เงินคงเหลือสุทธิ (₪)</span>
        <span class="net-amount" id="netDisplay">0</span>
        <div class="thb-amount">≈ ฿<span id="thbDisplay">0</span></div>
        
        <div style="display: flex; justify-content: center; gap: 20px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(0, 255, 136, 0.1);">
            <div style="text-align: center;">
                <span style="display: block; font-size: 0.6rem; color: #666; text-transform: uppercase;">ทำงานไปแล้ว</span>
                <span style="font-size: 1.1rem; color: var(--neon-green); font-weight: bold;">👷‍♂️ <span id="daysCount">0</span> วัน</span>
            </div>
            <div style="text-align: center;">
                <span style="display: block; font-size: 0.6rem; color: #666; text-transform: uppercase;">วันหยุด/พัก</span>
                <span style="font-size: 1.1rem; color: #888; font-weight: bold;">😴 <span id="restCount">0</span> วัน</span>
            </div>
        </div>

        <div style="font-size: 0.75rem; color: #666; margin-top: 15px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px;">
            เป้าหมายสิ้นเดือน: <span style="color:var(--neon-green); font-weight:bold;">฿<span id="predictTHB">0</span></span>
        </div>
    </div>

    <div class="chart-container"><canvas id="workChart"></canvas></div>

    <div class="glass-panel" style="text-align:center;">
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <button id="startBtn" class="btn btn-main btn-start" onclick="startWork()">🚀 เริ่มงาน (CHECK-IN)</button>
        <button id="endBtn" class="btn btn-main btn-end" style="display:none;" onclick="endWork()">🏁 เลิกงาน (CHECK-OUT)</button>
        <div class="input-row">
            <select id="monthSelect" onchange="renderData()"></select>
            <input type="number" id="cashDeduct" placeholder="เงินเบิก/หักจ่าย (₪)" oninput="renderData()" style="color:var(--neon-green);">
        </div>
    </div>

    <div style="display:flex; justify-content: space-between; gap:10px; margin-bottom: 20px;">
        <button class="btn btn-secondary" style="width:50%" onclick="manualInput()">➕ บันทึกย้อนหลัง</button>
        <button class="btn btn-secondary" style="width:50%" onclick="toggleSettings()">⚙️ ตั้งค่าระบบ</button>
    </div>

    <div id="manualForm" class="glass-panel" style="display:none; border:1px solid var(--neon-green);">
        <span class="net-label" style="display:block; margin-bottom:15px; color:#fff;">บันทึกย้อนหลัง</span>
        <input type="date" id="mDate" style="margin-bottom:12px;">
        <div class="input-row">
            <input type="time" id="mStart" value="06:00">
            <input type="time" id="mEnd" value="17:00">
        </div>
        <input type="text" id="mNote" placeholder="บันทึกข้อความ..." style="margin-top:12px;">
        <div class="input-row" style="margin-top:15px;">
            <button class="btn btn-secondary" onclick="saveManual()" style="background:var(--neon-green); color:#000;">บันทึก</button>
            <button class="btn btn-secondary" onclick="document.getElementById('manualForm').style.display='none'">ปิด</button>
        </div>
    </div>

    <div id="settingsPanel" class="glass-panel" style="display:none;">
        <span class="net-label" style="display:block; margin-bottom:15px; color:#fff;">การตั้งค่าระบบ</span>
        <div class="input-row">
            <div class="input-group"><label style="font-size:0.6rem">เรท/ชม. (₪)</label><input type="number" id="rate" value="38"></div>
            <div class="input-group"><label style="font-size:0.6rem">เรทบาท (฿)</label><input type="number" id="thbRate" value="9.8"></div>
        </div>
        <div class="input-row" style="margin-top:15px;">
            <button class="btn btn-secondary" onclick="exportData()">💾 Backup</button>
            <button class="btn btn-secondary" onclick="importData()">🔄 Restore</button>
        </div>
        <input type="file" id="fileInput" style="display:none" onchange="handleFile(event)">
        <button class="btn btn-secondary" style="margin-top:15px; color:var(--neon-pink); opacity:0.3;" onclick="resetAll()">🧹 ล้างข้อมูลทั้งหมด</button>
    </div>

    <div id="historyList"></div>
</div>

<script>
    let myChart = null;
    const getWorkData = () => JSON.parse(localStorage.getItem('work_data_v3') || "{}");

    function renderData() {
        const workData = getWorkData();
        const rate = parseFloat(document.getElementById('rate').value) || 38;
        const thbRate = parseFloat(document.getElementById('thbRate').value) || 9.8;
        const cashDeduct = parseFloat(document.getElementById('cashDeduct').value) || 0;
        const selectedMonth = document.getElementById('monthSelect').value;
        const listContainer = document.getElementById('historyList');
        
        let totalPay = 0, daysWorked = 0, labels = [], values = [], colors = [], borderColors = [];
        listContainer.innerHTML = `<span class="net-label" style="color:#444;">รายการบันทึกรายวัน</span><div style="height:15px;"></div>`;

        // เรียงวันที่จากใหม่ไปเก่า
        Object.keys(workData).sort().reverse().forEach(d => {
            if (d.includes(`-${selectedMonth}-`)) {
                const h = parseFloat(workData[d].hours);
                const dayIdx = new Date(d).getDay();
                
                // สูตรอิสราเอล: ปกติ 8 ชม. | วันเสาร์(6) x 1.5 | เกินนั้น OT ตามสเต็ป
                let np = (dayIdx === 6) ? Math.min(8, h) * rate * 1.5 : Math.min(8, h) * rate;
                let op = (dayIdx === 6) ? Math.max(0, h-8) * rate * 1.75 : (Math.max(0, Math.min(2, h-8)) * rate * 1.25) + (Math.max(0, h-10) * rate * 1.5);
                let dayTotal = Math.round(np + op);
                
                totalPay += dayTotal; daysWorked++;
                labels.unshift(d.split('-')[2]); values.unshift(dayTotal);
                
                // สีเขียวนีออนสำหรับ OT หนัก (สะดุดตา)
                if (h >= 10) { 
                    colors.unshift('rgba(0, 255, 136, 0.2)'); borderColors.unshift('#00ff88'); 
                } else if (h >= 8) { 
                    colors.unshift('rgba(0, 210, 255, 0.1)'); borderColors.unshift('#00d2ff'); 
                } else { 
                    colors.unshift('rgba(255, 255, 255, 0.02)'); borderColors.unshift('#333'); 
                }

                listContainer.innerHTML += `
                    <div class="history-item" onclick="del('${d}')">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="hist-day">${d.split('-')[2]}</span>
                            <div>
                                <span style="font-weight:bold; display:block;">${new Intl.DateTimeFormat('th-TH', {month:'short'}).format(new Date(d))}</span>
                                <span style="font-size:0.75rem; color:#888;">${workData[d].note || h + ' ชม.'}</span>
                            </div>
                        </div>
                        <div class="hist-pay">₪${dayTotal.toLocaleString()}</div>
                    </div>`;
            }
        });

        // คำนวณวันพัก (Feature 2)
        const year = new Date().getFullYear();
        const totalDaysInMonth = new Date(year, parseInt(selectedMonth), 0).getDate();
        document.getElementById('daysCount').innerText = daysWorked;
        document.getElementById('restCount').innerText = totalDaysInMonth - daysWorked;

        const net = totalPay - cashDeduct;
        document.getElementById('netDisplay').innerText = net.toLocaleString();
        document.getElementById('thbDisplay').innerText = Math.round(net * thbRate).toLocaleString();
        
        if(daysWorked > 0) {
            document.getElementById('predictTHB').innerText = Math.round((net / daysWorked) * totalDaysInMonth * thbRate).toLocaleString();
        } else { document.getElementById('predictTHB').innerText = "0"; }
        
        updateChart(labels, values, colors, borderColors);
        localStorage.setItem('config_rate', rate); localStorage.setItem('config_thb', thbRate);
        localStorage.setItem('config_cash', cashDeduct);
    }

    function updateChart(l, v, c, bc) {
        const ctx = document.getElementById('workChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, { 
            type: 'bar', 
            data: { labels: l, datasets: [{ data: v, backgroundColor: c, borderColor: bc, borderWidth: 2, borderRadius: 5, barThickness: 8 }] }, 
            options: { 
                responsive: true, maintainAspectRatio: false,
                scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#333', font: { size: 8 } } } }, 
                plugins: { legend: { display: false } } 
            },
            plugins: [{
                beforeDraw: (chart) => {
                    const ctx = chart.ctx; ctx.save();
                    ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(0, 255, 136, 0.4)';
                    ctx.restore();
                }
            }]
        });
    }

    function toggleSettings() {
        const p = document.getElementById('settingsPanel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
        if(p.style.display === 'block') document.getElementById('manualForm').style.display = 'none';
    }

    function manualInput() {
        document.getElementById('manualForm').style.display = 'block';
        document.getElementById('mDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('settingsPanel').style.display = 'none';
    }

    function saveManual() {
        const d = document.getElementById('mDate').value;
        const start = document.getElementById('mStart').value, end = document.getElementById('mEnd').value;
        if(!d || !start || !end) return;
        let sDec = parseInt(start.split(':')[0]) + (parseInt(start.split(':')[1])/60);
        let eDec = parseInt(end.split(':')[0]) + (parseInt(end.split(':')[1])/60);
        if(eDec < sDec) eDec += 24;
        let diff = eDec - sDec;
        let finalH = diff > 5 ? (diff - 0.5).toFixed(2) : diff.toFixed(2);
        let wd = getWorkData(); wd[d] = { hours: parseFloat(finalH), note: document.getElementById('mNote').value };
        localStorage.setItem('work_data_v3', JSON.stringify(wd));
        document.getElementById('manualForm').style.display = 'none';
        renderData();
    }

    function exportData() {
        const data = localStorage.getItem('work_data_v3');
        const blob = new Blob([data], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `work_backup.json`; a.click();
    }

    function importData() { document.getElementById('fileInput').click(); }
    function handleFile(e) {
        const reader = new FileReader();
        reader.onload = (ev) => { localStorage.setItem('work_data_v3', ev.target.result); window.location.reload(); };
        reader.readAsText(e.target.files[0]);
    }

    function startWork() { localStorage.setItem('running_start_time', Date.now()); window.location.reload(); }
    function endWork() {
        const start = localStorage.getItem('running_start_time');
        const diff = (Date.now() - parseInt(start)) / 3600000;
        let finalH = diff > 5 ? (diff - 0.5).toFixed(2) : diff.toFixed(2);
        if(!confirm(`บันทึกเวลาเลิกงาน: ${finalH} ชม.?`)) return;
        let wd = getWorkData(); wd[new Date().toISOString().split('T')[0]] = { hours: parseFloat(finalH) };
        localStorage.setItem('work_data_v3', JSON.stringify(wd));
        localStorage.removeItem('running_start_time');
        window.location.reload();
    }

    function checkRunningTimer() {
        const saved = localStorage.getItem('running_start_time');
        if (saved) {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('endBtn').style.display = 'block';
            setInterval(() => {
                const diff = new Date() - new Date(parseInt(saved));
                const h = Math.floor(diff/3600000).toString().padStart(2,'0');
                const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
                const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
                document.getElementById('timerDisplay').innerText = `${h}:${m}:${s}`;
            }, 1000);
        }
    }

    function del(d) { if(confirm(`ลบวันที่ ${d}?`)) { let wd = getWorkData(); delete wd[d]; localStorage.setItem('work_data_v3', JSON.stringify(wd)); renderData(); } }
    function resetAll() { if(confirm('🚨 ล้างข้อมูลทั้งหมด?')) { localStorage.clear(); window.location.reload(); } }

    // Init Month Select
    const mSelect = document.getElementById('monthSelect');
    const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    for(let i=1; i<=12; i++) {
        let opt = document.createElement('option'); opt.value = i.toString().padStart(2, '0');
        opt.innerText = monthNames[i-1];
        if(i === new Date().getMonth()+1) opt.selected = true;
        mSelect.appendChild(opt);
    }
    
    // Load Config
    document.getElementById('rate').value = localStorage.getItem('config_rate') || 38;
    document.getElementById('thbRate').value = localStorage.getItem('config_thb') || 9.8;
    document.getElementById('cashDeduct').value = localStorage.getItem('config_cash') || 0;
    
    checkRunningTimer(); renderData();
</script>
</body>
</html>
