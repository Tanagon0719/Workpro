<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Pro - Share Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --neon-blue: #00d2ff; --neon-pink: #ff007f; --neon-green: #00ff88; --neon-purple: #9d50bb; --gold: #ffcc00; --bg-black: #0a0b10; --glass: rgba(255, 255, 255, 0.08); }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-black); background-image: linear-gradient(135deg, #0f172a 0%, #020617 100%); color: #fff; margin: 0; padding: 15px; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; }
        .glass-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; padding: 20px; margin-bottom: 15px; }
        .card-title { font-size: 0.7rem; font-weight: 900; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; display: block; }
        .predict-box { background: linear-gradient(135deg, rgba(157, 80, 187, 0.2), rgba(110, 72, 170, 0.1)); border: 1px solid var(--neon-purple); border-radius: 22px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .predict-val { font-size: 1.8rem; font-weight: 900; color: var(--neon-purple); text-shadow: 0 0 10px rgba(157, 80, 187, 0.5); }
        .timer-display { font-size: 3.5rem; font-weight: 900; text-align: center; margin: 10px 0; color: #fff; text-shadow: 0 0 20px var(--neon-blue); font-family: monospace; }
        .btn { padding: 18px; border: none; border-radius: 18px; font-weight: 900; width: 100%; cursor: pointer; transition: 0.3s; font-size: 1.1rem; text-transform: uppercase; }
        .btn-start { background: linear-gradient(45deg, #00d2ff, #3a7bd5); color: #fff; }
        .btn-end { background: linear-gradient(45deg, #f80759, #bc4e9c); color: #fff; }
        .btn-manual { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; margin-top: 10px; font-size: 0.8rem; }
        .summary-box { background: linear-gradient(180deg, rgba(0,255,136,0.1) 0%, rgba(0,0,0,0.4) 100%); border: 2px solid var(--neon-green); border-radius: 35px; padding: 25px 20px; text-align: center; }
        .net-amount { font-size: 3.2rem; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 15px rgba(0,255,136,0.4); display: block; }
        input, select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 15px; color: #fff; outline: none; width: 100%; box-sizing: border-box; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8rem; }
        td { padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .backup-section { margin-top: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; opacity: 0.8; }
        .btn-backup { padding: 10px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; cursor: pointer; border: 1px solid #444; background: #111; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="glass-card"><span class="card-title">📊 DAILY EARNING BARS</span><div style="height: 180px;"><canvas id="workChart"></canvas></div></div>
    <div class="predict-box"><span class="card-title" style="color:var(--neon-purple); margin-bottom:5px;">🔮 PREDICTION</span><div class="predict-val">฿ <span id="predictTHB">0</span></div></div>
    <div class="settings-grid">
        <div class="setting-item"><label style="font-size:0.6rem">ILS RATE</label><input type="number" id="rate" value="38" oninput="renderData()"></div>
        <div class="setting-item"><label style="font-size:0.6rem">THB RATE</label><input type="number" id="thbRate" value="9.8" oninput="renderData()"></div>
    </div>
    <div class="glass-card" style="text-align:center;">
        <span class="card-title">🕒 TRACKER</span>
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:10px; margin-bottom:12px;">
            <input type="month" id="monthFilter" onchange="renderData()">
            <select id="currentShift"><option value="day">Day Shift</option><option value="night">Night Shift</option></select>
        </div>
        <button id="startBtn" class="btn btn-start" onclick="startWork()">START MISSION</button>
        <button id="endBtn" class="btn btn-end" style="display:none;" onclick="endWork()">COMPLETE MISSION</button>
        <button class="btn btn-manual" onclick="manualSave()">➕ บันทึกย้อนหลัง (Manual Save)</button>
    </div>
    <div class="summary-box">
        <span class="net-amount">₪ <span id="netDisplay">0</span></span>
        <span style="font-size:1.6rem; color:var(--gold); font-weight:800;">≈ ฿ <span id="thbDisplay">0</span></span>
        <input type="number" id="manualDeduct" style="border:1px dashed #ff007f; text-align:center; margin-top:10px; background:none; color:#ff8a80;" placeholder="หักภาษี/ค่าบ้าน (₪)" oninput="renderData()">
        <button onclick="copySummary()" style="background:var(--neon-green); border:none; color:#000; padding:12px; border-radius:15px; font-weight:900; width:100%; margin-top:15px;">📤 EXPORT TO LINE</button>
    </div>
    <div class="glass-card" style="margin-top:15px; padding:10px; max-height:180px; overflow-y:auto;">
        <table><tbody id="tableBody"></tbody></table>
    </div>
    <div class="backup-section">
        <button class="btn-backup" style="grid-column: span 2; border-color: var(--neon-blue);" onclick="importFromChat()">📥 วางข้อมูลที่ก๊อปจากแชท</button>
        <button class="btn-backup" onclick="exportData()">💾 Backup File</button>
        <button class="btn-backup" onclick="importData()">🔄 Restore File</button>
    </div>
</div>
<script>
    let myChart = null;
    const quotes = ["วันนี้คุณเก่งมาก! 😴", "ยอดเยี่ยม! ใกล้ฝันแล้ว 🚀", "พรุ่งนี้รวย! 💰", "พักผ่อนเยอะๆ นะ 🍜", "ภูมิใจในตัวคุณ! 🏁"];
    function getWorkData() { return JSON.parse(localStorage.getItem('work_data_v3') || "{}"); }
    function renderData() {
        const workData = getWorkData(); const tbody = document.getElementById('tableBody');
        const rate = parseFloat(document.getElementById('rate').value) || 38;
        const thbRate = parseFloat(document.getElementById('thbRate').value) || 9.8;
        const manualDeduct = parseFloat(document.getElementById('manualDeduct').value) || 0;
        const monthFilter = document.getElementById('monthFilter').value;
        let totalPay = 0, daysWorked = 0, labels = [], values = [], colors = [];
        tbody.innerHTML = "";
        Object.keys(workData).sort().forEach(d => {
            if (d.startsWith(monthFilter)) {
                const entry = workData[d]; let h = parseFloat(entry.hours) || 0;
                let dayIdx = new Date(d).getDay();
                let np = (dayIdx === 6) ? Math.min(8, h) * rate * 1.5 : Math.min(8, h) * rate;
                let op = (dayIdx === 6) ? Math.max(0, h-8) * rate * 1.75 : (Math.max(0, Math.min(2, h-8)) * rate * 1.25) + (Math.max(0, h-10) * rate * 1.5);
                let dayTotal = Math.round(np + op);
                totalPay += dayTotal; daysWorked++;
                labels.push(d.split('-')[2]); values.push(dayTotal);
                if (h >= 10) colors.push('#ff007f'); else if (h >= 8) colors.push('#00ff88'); else colors.push('#00d2ff');
                tbody.innerHTML = `<tr><td>${d.split('-')[2]}</td><td>${h}h</td><td style="color:var(--neon-green); text-align:right;">₪${dayTotal}</td><td onclick="del('${d}')" style="opacity:0.2; text-align:right;">✕</td></tr>` + tbody.innerHTML;
            }
        });
        const net = Math.round(totalPay) - manualDeduct;
        document.getElementById('netDisplay').innerText = net.toLocaleString();
        document.getElementById('thbDisplay').innerText = Math.round(net * thbRate).toLocaleString();
        if(daysWorked > 0) {
            const lastDay = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
            document.getElementById('predictTHB').innerText = Math.round((net / daysWorked) * lastDay * thbRate).toLocaleString();
        }
        updateChart(labels, values, colors);
        localStorage.setItem('config_rate', rate); localStorage.setItem('config_thb', thbRate);
    }
    function updateChart(l, v, c) {
        const ctx = document.getElementById('workChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'bar', data: { labels: l, datasets: [{ data: v, backgroundColor: c, borderRadius: 8, barThickness: 12 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#888', font: { size: 9 } } } }, plugins: { legend: { display: false } } } });
    }
    function manualSave() {
        const d = prompt("ใส่วันที่ (เช่น 2026-03-18):", new Date().toISOString().split('T')[0]);
        const h = prompt("ใส่จำนวนชั่วโมง (เช่น 11):");
        if(d && h) { let wd = getWorkData(); wd[d] = { hours: parseFloat(h) }; localStorage.setItem('work_data_v3', JSON.stringify(wd)); renderData(); }
    }
    function importFromChat() { const txt = prompt("วางข้อมูล JSON:"); if(txt) { try { localStorage.setItem('work_data_v3', JSON.stringify(JSON.parse(txt))); window.location.reload(); } catch(e) { alert("พลาด!"); } } }
    function exportData() { const data = localStorage.getItem('work_data_v3'); const blob = new Blob([data], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `work_backup.json`; a.click(); }
    function importData() { const input = document.createElement('input'); input.type = 'file'; input.onchange = e => { const reader = new FileReader(); reader.onload = event => { localStorage.setItem('work_data_v3', event.target.result); window.location.reload(); }; reader.readAsText(e.target.files[0]); }; input.click(); }
    function startWork() { localStorage.setItem('running_start_time', Date.now()); window.location.reload(); }
    function endWork() {
        const start = localStorage.getItem('running_start_time');
        const diff = (Date.now() - parseInt(start)) / 3600000;
        let finalH = diff > 5 ? (diff - 0.5).toFixed(2) : diff.toFixed(2);
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        if(!confirm(`💰 ${finalH} ชม.\n\n"${q}"`)) return;
        let wd = getWorkData(); wd[new Date().toISOString().split('T')[0]] = { hours: parseFloat(finalH) };
        localStorage.setItem('work_data_v3', JSON.stringify(wd)); localStorage.removeItem('running_start_time'); window.location.reload();
    }
    function checkRunningTimer() { const saved = localStorage.getItem('running_start_time'); if (saved) { document.getElementById('startBtn').style.display = 'none'; document.getElementById('endBtn').style.display = 'block'; setInterval(() => { const diff = new Date() - new Date(parseInt(saved)); const h = Math.floor(diff/3600000).toString().padStart(2,'0'); const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0'); const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0'); document.getElementById('timerDisplay').innerText = `${h}:${m}:${s}`; }, 1000); } }
    function del(d) { if(confirm('ลบ?')) { let wd = getWorkData(); delete wd[d]; localStorage.setItem('work_data_v3', JSON.stringify(wd)); renderData(); } }
    function copySummary() { const msg = `📊 REPORT\n₪ สุทธิ: ${document.getElementById('netDisplay').innerText}\n฿ ไทย: ${document.getElementById('thbDisplay').innerText}\n🔮 คาดการณ์: ฿${document.getElementById('predictTHB').innerText}`; navigator.clipboard.writeText(msg).then(() => alert("คัดลอกแล้ว!")); }
    document.getElementById('rate').value = localStorage.getItem('config_rate') || 38;
    document.getElementById('thbRate').value = localStorage.getItem('config_thb') || 9.8;
    document.getElementById('monthFilter').value = new Date().toISOString().substring(0, 7);
    checkRunningTimer(); renderData();
</script>
</body>
</html>
