<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Log Israel V23.7.5 (Fix Past Times)</title>
    <style>
        :root { 
            --main-bg: #040608; 
            --card-bg: rgba(15, 22, 20, 0.7); 
            --neon-color: #00ff88; 
            --neon-blue: #00d2ff;
            --neon-pink: #ff007f;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', 'Tahoma', sans-serif; background: var(--main-bg); color: #e0e0e0; margin: 0; padding: 15px; font-size: 14px; transition: background 0.5s ease; }
        .container { max-width: 450px; margin: 0 auto; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-picker { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--neon-color); color: var(--neon-color); padding: 5px 10px; border-radius: 10px; font-weight: bold; transition: 0.3s; }

        .lang-bar { display: flex; gap: 5px; }
        .lang-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #888; padding: 4px 10px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; }
        .lang-btn.active { border-color: var(--neon-color); color: var(--neon-color); background: rgba(255,255,255,0.02); }

        .main-stat-card { background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0.5)); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 30px; padding: 20px; text-align: center; margin-bottom: 20px; position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .net-amount { font-size: 3.5rem; font-weight: 900; color: #fff; display: block; text-shadow: 0 0 20px var(--neon-color); }
        .total-hours-badge { display: inline-block; background: rgba(255, 255, 255, 0.05); color: var(--neon-blue); padding: 4px 15px; border-radius: 12px; font-weight: bold; margin-top: 10px; font-size: 0.9rem; border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .toggle-eye-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: var(--neon-color); font-size: 1.3rem; cursor: pointer; padding: 5px; line-height: 1; }

        .glass-panel { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 25px; padding: 20px; margin-bottom: 15px; backdrop-filter: blur(15px); }
        .timer-display { font-size: 3.2rem; font-family: monospace; font-weight: bold; text-align: center; margin-bottom: 15px; }
        
        .btn { border: none; border-radius: 20px; font-weight: 800; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .btn-main { height: 60px; font-size: 1.1rem; margin-bottom: 10px; }
        .btn-start { background: #fff; color: #000; }
        .btn-end { background: var(--neon-color); color: #000; box-shadow: 0 0 15px var(--neon-color); }
        .btn-secondary { background: rgba(255,255,255,0.03); color: #aaa; padding: 12px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.05); }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        input, select { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; padding: 12px; width: 100%; }
        
        .history-item { background: rgba(255,255,255,0.02); border-radius: 18px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .hist-info { display: flex; flex-direction: column; gap: 2px; }
        .hist-time-tag { font-size: 0.7rem; color: var(--neon-blue); font-family: monospace; }
        .hist-pay { text-align: right; font-weight: 800; color: var(--neon-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <select id="monthFilter" class="month-picker" onchange="applyMonthlyTheme(); renderData();"></select>
        
        <div class="lang-bar">
            <button class="lang-btn active" id="btn-th" onclick="setLang('th')">TH</button>
            <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
            <button class="lang-btn" id="btn-he" onclick="setLang('he')">עบ</button>
        </div>
    </div>

    <div class="main-stat-card">
        <button id="toggleVisibilityBtn" class="toggle-eye-btn" onclick="toggleIncomeVisibility()">👁️</button>
        
        <span id="txt-net-label">เงินคงเหลือสุทธิ</span>
        <span class="net-amount" id="netDisplay">0</span>
        <div style="font-size: 1.2rem; color: var(--neon-color); margin-bottom: 5px; font-weight: bold;">≈ ฿<span id="thbDisplay">0</span></div>
        <div class="total-hours-badge">
            <span id="txt-total-label">รวม:</span> <span id="totalHoursDisplay">0.00</span> <span id="txt-unit-label">ชม.</span>
        </div>
    </div>

    <div class="glass-panel" style="text-align:center;">
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <div id="startGroup">
            <button class="btn btn-main btn-start" onclick="startWork()">🚀 <span id="txt-start-btn">เริ่มงาน</span></button>
            <button class="btn btn-secondary" onclick="forgotToStart()">🕒 <span id="txt-forgot-btn">ลืมกดเริ่ม</span></button>
        </div>
        <button id="endBtn" class="btn btn-main btn-end" style="display:none;" onclick="endWork()">🏁 <span id="txt-end-btn">เลิกงาน</span></button>
    </div>

    <div style="display:flex; gap:10px; margin-bottom: 20px;">
        <button class="btn btn-secondary" style="width:50%" onclick="manualInput()">➕ <span id="txt-manual-btn">บันทึกย้อนหลัง</span></button>
        <button class="btn btn-secondary" style="width:50%" onclick="toggleSettings()">⚙️ <span id="txt-settings-btn">ตั้งค่า</span></button>
    </div>

    <div id="settingsPanel" class="glass-panel" style="display:none;">
        <div class="input-row">
            <div><label style="font-size:0.6rem">เรทปกติ (₪)</label><input type="number" id="rate" value="38"></div>
            <div><label style="font-size:0.6rem">เรทบาท (฿)</label><input type="number" id="thbRate" value="9.8"></div>
        </div>
        <div class="input-row" style="margin-top:15px;">
            <button class="btn btn-secondary" onclick="exportData()">💾 Backup</button>
            <button class="btn btn-secondary" onclick="importData()">🔄 Restore</button>
        </div>
        <input type="file" id="fileInput" style="display:none" onchange="handleFile(event)">
        <button class="btn btn-secondary" style="margin-top:15px; color:var(--neon-pink); opacity:0.3;" onclick="resetAll()">🧹 RESET ALL</button>
    </div>

    <div id="manualForm" class="glass-panel" style="display:none;">
        <input type="date" id="mDate">
        <div class="input-row"><input type="time" id="mStart" value="06:00"><input type="time" id="mEnd" value="17:00"></div>
        <div class="input-row" style="margin-top:15px;">
            <button class="btn btn-secondary" onclick="saveManual()" style="background:var(--neon-color); color:#000; box-shadow: 0 0 10px var(--neon-color);">SAVE</button>
            <button class="btn btn-secondary" onclick="document.getElementById('manualForm').style.display='none'">CLOSE</button>
        </div>
    </div>

    <div id="historyList"></div>
</div>

<script>
    const i18n = {
        th: { net: "เงินคงเหลือสุทธิ", start: "เริ่มงาน", end: "เลิกงาน", forgot: "ลืมกดเริ่ม", manual: "บันทึกย้อนหลัง", settings: "ตั้งค่า", in: "เข้า", out: "ออก", total: "รวม:", unit: "ชม." },
        en: { net: "Net Balance", start: "Check-in", end: "Check-out", forgot: "Forgot Start", manual: "Manual Entry", settings: "Settings", in: "In", out: "Out", total: "Total:", unit: "hrs" },
        he: { net: "יתרה נטו", start: "כניסה", end: "יציאה", forgot: "שכחתי כניסה", manual: "הזנה ידנית", settings: "הגדרות", in: "כניסה", out: "יציאה", total: "סה\"כ:", unit: "שעות" }
    };
    let currentLang = 'th';
    let isIncomeHidden = false;

    const monthlyThemes = {
        "01": "#00ff88", "02": "#00ffea", "03": "#bd00ff", "04": "#ff0055",
        "05": "#ff5500", "06": "#ffb700", "07": "#00d2ff", "08": "#70ff00",
        "09": "#ff00c8", "10": "#ff3c00", "11": "#00ffa6", "12": "#9d50bb"
    };

    function applyMonthlyTheme() {
        const selectedMonth = document.getElementById('monthFilter').value;
        const targetColor = monthlyThemes[selectedMonth] || "#00ff88";
        document.documentElement.style.setProperty('--neon-color', targetColor);
    }

    const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    const monthFilter = document.getElementById('monthFilter');
    const now = new Date();
    for(let i=0; i<12; i++) {
        let opt = document.createElement('option');
        opt.value = (i + 1).toString().padStart(2, '0');
        opt.innerText = monthNames[i];
        if(i === now.getMonth()) opt.selected = true;
        monthFilter.appendChild(opt);
    }

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${lang}`).classList.add('active');
        document.getElementById('txt-net-label').innerText = i18n[lang].net;
        document.getElementById('txt-start-btn').innerText = i18n[lang].start;
        document.getElementById('txt-end-btn').innerText = i18n[lang].end;
        document.getElementById('txt-forgot-btn').innerText = i18n[lang].forgot;
        document.getElementById('txt-manual-btn').innerText = i18n[lang].manual;
        document.getElementById('txt-settings-btn').innerText = i18n[lang].settings;
        document.getElementById('txt-total-label').innerText = i18n[lang].total;
        document.getElementById('txt-unit-label').innerText = i18n[lang].unit;
        renderData();
    }

    const getWorkData = () => JSON.parse(localStorage.getItem('work_data_v3') || "{}");

    function toggleIncomeVisibility() {
        isIncomeHidden = !isIncomeHidden;
        const btn = document.getElementById('toggleVisibilityBtn');
        btn.textContent = isIncomeHidden ? '🙈' : '👁️';
        renderData();
    }

    // ฟังก์ชันช่วยเดาเวลาเข้า-ออกย้อนหลัง กรณีไม่มีข้อมูลติดมาใน Object
    function autoEstimateTimes(hours) {
        let startH = 6; // สมมติค่ามาตรฐานเริ่มต้นที่ 06:00
        let startM = 0;
        
        // แปลงชั่วโมงทำงานกลับเป็นเวลาเลิกงาน
        let totalMinutes = Math.round(hours * 60);
        // ถ้าทำงานเกิน 5 ชั่วโมง ให้บวกเวลาพักเพิ่ม 30 นาทีกลับเข้าไปตามเงื่อนไขแอป
        if (hours > 5) {
            totalMinutes += 30;
        }

        let endTotalMinutes = (startH * 60 + startM) + totalMinutes;
        let endH = Math.floor(endTotalMinutes / 60) % 24;
        let endM = endTotalMinutes % 60;

        let startTimeStr = `${startH.toString().padStart(2, '0')}:${startM.toString().padStart(2, '0')}`;
        let endTimeStr = `${endH.toString().padStart(2, '0')}:${endM.toString().padStart(2, '0')}`;
        
        return { start: startTimeStr, end: endTimeStr };
    }

    function renderData() {
        const workData = getWorkData();
        const rate = parseFloat(document.getElementById('rate').value) || 38;
        const thbRate = parseFloat(document.getElementById('thbRate').value) || 9.8;
        const selectedMonth = document.getElementById('monthFilter').value;
        const listContainer = document.getElementById('historyList');
        
        let totalPay = 0;
        let totalHours = 0;
        listContainer.innerHTML = '';

        Object.keys(workData).sort().reverse().forEach(d => {
            if (d.split('-')[1] === selectedMonth) {
                const item = workData[d];
                const h = item.hours;
                totalHours += h;
                
                let dayPay = Math.round(h * rate);
                totalPay += dayPay;
                
                let displayDayPay = isIncomeHidden ? '***' : `₪${dayPay.toLocaleString()}`;
                
                // ตรวจสอบและดักจับ: หากไม่มีค่า startTime หรือ endTime ให้รันฟังก์ชันเดาเวลาแทนการปล่อยให้ขึ้น --:--
                let showStart = item.startTime;
                let showEnd = item.endTime;
                
                if (!showStart || showStart === '--:--' || !showEnd || showEnd === '--:--') {
                    let estimated = autoEstimateTimes(h);
                    showStart = showStart || estimated.start;
                    showEnd = showEnd || estimated.end;
                }
                
                listContainer.innerHTML += `
                    <div class="history-item">
                        <div class="hist-info">
                            <span style="font-weight:900; font-size:1.2rem;">${d.split('-')[2]}</span>
                            <span class="hist-time-tag">
                                ${i18n[currentLang].in}: ${showStart} | ${i18n[currentLang].out}: ${showEnd}
                            </span>
                            <span style="font-size:0.7rem; color:#666;">${h} ${i18n[currentLang].unit}</span>
                        </div>
                        <div class="hist-pay">${displayDayPay}</div>
                    </div>`;
            }
        });

        if (isIncomeHidden) {
            document.getElementById('netDisplay').innerText = '***';
            document.getElementById('thbDisplay').innerText = '***';
        } else {
            document.getElementById('netDisplay').innerText = totalPay.toLocaleString();
            document.getElementById('thbDisplay').innerText = Math.round(totalPay * thbRate).toLocaleString();
        }
        
        document.getElementById('totalHoursDisplay').innerText = totalHours.toFixed(2);
    }

    function toggleSettings() { const p = document.getElementById('settingsPanel'); p.style.display = (p.style.display === 'none') ? 'block' : 'none'; }
    function exportData() { const data = localStorage.getItem('work_data_v3'); const blob = new Blob([data], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `work_backup.json`; a.click(); }
    function importData() { document.getElementById('fileInput').click(); }
    function handleFile(e) { const reader = new FileReader(); reader.onload = (ev) => { localStorage.setItem('work_data_v3', ev.target.result); window.location.reload(); }; reader.readAsText(e.target.files[0]); }
    
    function startWork() { 
        const now = new Date(); 
        localStorage.setItem('running_start_time', now.getTime()); 
        localStorage.setItem('start_clock', now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0')); 
        window.location.reload(); 
    }
    
    function endWork() { 
        const startTs = localStorage.getItem('running_start_time');
        const startClock = localStorage.getItem('start_clock');
        const now = new Date();
        const endClock = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        const diff = (now.getTime() - parseInt(startTs)) / 3600000;
        let finalH = diff > 5 ? (diff - 0.5).toFixed(2) : diff.toFixed(2);
        let wd = getWorkData();
        wd[now.toISOString().split('T')[0]] = { hours: parseFloat(finalH), startTime: startClock, endTime: endClock };
        localStorage.setItem('work_data_v3', JSON.stringify(wd));
        localStorage.removeItem('running_start_time');
        window.location.reload();
    }
    
    function forgotToStart() {
        const time = prompt("เวลาเริ่มงานจริง (HH:MM)", "06:00");
        if(time) {
            const now = new Date();
            const [h, m] = time.split(':');
            const startStr = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
            localStorage.setItem('running_start_time', startStr.getTime());
            localStorage.setItem('start_clock', time);
            window.location.reload();
        }
    }
    
    function saveManual() {
        const d = document.getElementById('mDate').value;
        const s = document.getElementById('mStart').value;
        const e = document.getElementById('mEnd').value;
        if(!d || !s || !e) return;
        let sDec = parseInt(s.split(':')[0]) + (parseInt(s.split(':')[1])/60);
        let eDec = parseInt(e.split(':')[0]) + (parseInt(e.split(':')[1])/60);
        if(eDec < sDec) eDec += 24;
        let diff = eDec - sDec;
        let finalH = diff > 5 ? (diff - 0.5).toFixed(2) : diff.toFixed(2);
        let wd = getWorkData();
        // มั่นใจได้ว่าการเซฟจากหน้า Manual จะผูกค่าฟิลด์ startTime และ endTime ลงฐานข้อมูลตรงๆ เสมอ
        wd[d] = { hours: parseFloat(finalH), startTime: s, endTime: e };
        localStorage.setItem('work_data_v3', JSON.stringify(wd));
        document.getElementById('manualForm').style.display='none';
        renderData();
    }
    
    function manualInput() { document.getElementById('manualForm').style.display='block'; document.getElementById('mDate').value = new Date().toISOString().split('T')[0]; }
    function resetAll() { if(confirm('ล้างข้อมูลทั้งหมด?')) { localStorage.clear(); window.location.reload(); } }
    
    function checkRunningTimer() {
        const saved = localStorage.getItem('running_start_time');
        if (saved) {
            document.getElementById('startGroup').style.display = 'none';
            document.getElementById('endBtn').style.display = 'block';
            setInterval(() => {
                const diff = new Date() - new Date(parseInt(saved));
                const h = Math.floor(diff/3600000).toString().padStart(2,'0');
                const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
                const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
                document.getElementById('timerDisplay').innerText = `${h}:${m}:${s}`;
            }, 1000);
        }
    }
    
    applyMonthlyTheme();
    checkRunningTimer(); 
    renderData();
</script>
</body>
</html>
